services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: defaultchat
      POSTGRES_PASSWORD: defaultchat
      POSTGRES_DB: defaultchat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defaultchat -d defaultchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_USER: defaultchat
      DB_PASSWORD: defaultchat
      DB: defaultchat
      PGPORT: 5432
      PORT: 3001
      SECRET_KEY: docker-demo-secret-key-change-me
      TOKEN_EXPIRES_TIME: 24h
      CORS_ORIGIN: http://localhost:3000
      AWS_ACCESSKEYID: local
      AWS_SECRETACCESSKEY: local
      AWS_REGION: us-east-1
      AWS_BUCKETNAME: local
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
